<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">

  <meta name="viewport" content="width=device-width" />
  <title>Admin Portal</title>
</head>

<body>
  <!-- Tämän päivän tiedot -->
  <div class="main-wrapper">
    <header class="ylin-container">
      <div class="leimakortti">
        <h1 class="otsikko">Leimakortti</h1>
      </div>
      <p class="block aika">3:52</p>
      <p class="block weather">4C</p>
      <a href="admin.html" class="block sign-in">Admin kirjautuminen</a>
    </header>
    <main class="tiedot">
      <section class="lasnaolijat-wrapper">
        <div class="lasnaolijat-container">
          <h3>Napauta RFID-lätkää puhelimen päällä tai kirjaudu tunnuksillasi sisään</h3>
          <p class="bubble paikalla">Paikalla</p>
          <p class="bubble odottaa">Odottaa</p>
          <p class="bubble poissa">Poissa</p>
        </div>
        <div class="henkilo-container">
          <div class="tyontekijat-wrapper">
            <!--Tallenetut henkilöstöt  -->
            <article class="block henkilo">
            </article>
          </div>
        </div>
      </section>
      <!-- Tallenetut ohaajat -->
      <div class="side-wrapper">
        <div class="block ohjaajat">
          <p>Ohjaajat</p>
        </div>
        <div class="block info">
          <h2>Käyttöohjeet</h2>
          <br>
          <p>Näyttämällä RFID-lätkää näytön vieressä olevan puhelimen päällä voit tunnistautua ilman
            sisäänkirjautumista.
          </p>
        </div>
      </div>
    </main>
  </div>
</body>

</html>

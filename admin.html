<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width" />
  <title>Admin Portal</title>
</head>

<body>
  <div class="main-wrapper">
    <header class="ylin-container">
      <div class="alku">
        <h1 class="otsikko"> Päivän läsnäolijat</h1>
      </div>
      <div class="loppu">
        <a href="index.html" class="block etusivu">Etusivu</a>
      </div>
    </header>
    <!--Tallenetut henkilöstöt  -->
    <section class="lasnaolijat-container">
      <div class="olijat-box paikalla">
        <p>Paikalla</p>
        <br>
        <p class="paikalla-olijat"></p>
      </div>
      <div class="olijat-box odottaa">
        <p>Odottaa</p>
        <br>
        <p class="odottaa-olijat"></p>
      </div>
      <div class="olijat-box poissa">
        <p>Poissa</p>
        <br>
        <p class="poissa-olijat"></p>
      </div>
    </section>
    <main class="tiedot">
      <div class="lasnaolijat-wrapper">
        <div class="block tyontekijat-wrapper">
        </div>
      </div>
      <div class="side-wrapper-admin">
        <!-- Tallenetut ohaajat -->
        <div class="block">
          <h3>Ohjaajat</h3>
          <div class="ohjaajat">
          </div>
        </div>
        <div class="block lisaa-ohjaaja">
          <form class="ohjaaja-form">
            <h3>Lisää Ohjaaja</h3>
            <label for="nimi">Nimi</label>
            <br>
            <input type="text" id="nimi">
            <br>
            <label for="lisatiedot">Lisätiedot</label>
            <br>
            <textarea id="lisatiedot"></textarea>
            <br>
            <label for="yhteystiedot">Yhteystiedot</label>
            <br>
            <input type="text" id="yhteystiedot">
            <br>
            <button type="submit" id="hyvaksy">Lisää Ohjaaja</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>

</html>
